<!doctype html>

  <head>
    <meta charset="UTF-8" />
    <meta name="theme-color" content="hsl(0 0% 98%)" />
    <script>
      ;(() => {
        const storageKey = "vite-ui-theme"
        const root = document.documentElement
        const mediaQuery = window.matchMedia("(prefers-color-scheme: dark)")

        const resolveTheme = (theme) =>
          theme === "system" ? (mediaQuery.matches ? "dark" : "light") : theme

        function updateThemeColor(nextTheme) {
          const themeColor = nextTheme === "dark" ? "hsl(30 15% 8%)" : "hsl(0 0% 98%)"
          let meta = document.querySelector('meta[name="theme-color"]')

          if (!meta) {
            meta = document.createElement("meta")
            meta.setAttribute("name", "theme-color")
            document.head.appendChild(meta)
          }

          meta.setAttribute("content", themeColor)
        }

        function applyResolvedTheme(resolvedTheme) {
          root.classList.remove("light", "dark")
          root.classList.add(resolvedTheme)
          root.style.colorScheme = resolvedTheme
          root.style.backgroundColor =
            resolvedTheme === "dark" ? "hsl(30 15% 8%)" : "hsl(0 0% 98%)"
          updateThemeColor(resolvedTheme)
        }

        let theme = "system"

        try {
          const storedTheme = localStorage.getItem(storageKey)
          if (storedTheme === "light" || storedTheme === "dark" || storedTheme === "system") {
            theme = storedTheme
          }
        } catch (_e) {
          theme = "system"
        }

        applyResolvedTheme(resolveTheme(theme))

        root.toggleAttribute("data-initial-home", location.pathname === "/")
        root.toggleAttribute("data-initial-detail", /^\/server\/[^/]+\/?$/.test(location.pathname))

      })()
    </script>

      .boot-spinner-inner { position: relative; top: 50%; left: 50%; width: var(--size); height: var(--size); }

      .boot-spinner-bar:nth-child(1) { transform: rotate(0deg) translate(120%); animation-delay: -0.8s; }
      .boot-spinner-bar:nth-child(2) { transform: rotate(45deg) translate(120%); animation-delay: -0.7s; }
      .boot-spinner-bar:nth-child(3) { transform: rotate(90deg) translate(120%); animation-delay: -0.6s; }
      .boot-spinner-bar:nth-child(4) { transform: rotate(135deg) translate(120%); animation-delay: -0.5s; }
      .boot-spinner-bar:nth-child(5) { transform: rotate(180deg) translate(120%); animation-delay: -0.4s; }
      .boot-spinner-bar:nth-child(6) { transform: rotate(225deg) translate(120%); animation-delay: -0.3s; }
      .boot-spinner-bar:nth-child(7) { transform: rotate(270deg) translate(120%); animation-delay: -0.2s; }
      .boot-spinner-bar:nth-child(8) { transform: rotate(315deg) translate(120%); animation-delay: -0.1s; }
      @keyframes boot-spin { from { opacity: 1; } to { opacity: .15; } }
